[package]
name = "webcpp-beast-host-tls-fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
publish = false
license = "BSL-1.0"

[dependencies]
bytes = "1.11.1"
http = "1.5.0"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["client", "server", "http1"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.51.1", features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
wasmtime = { version = "=50.0.1", default-features = false, features = ["std", "runtime", "cranelift", "component-model", "component-model-async", "gc-null"] }
wasmtime-wasi = { version = "=50.0.1", default-features = false, features = ["p2", "p3"] }
wasmtime-wasi-http = { version = "=50.0.1", default-features = false, features = ["p2", "p3", "component-model-async"] }

[profile.dev]
debug = 0
